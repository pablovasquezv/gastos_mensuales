{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos - Iniciar Sesión</title>
    
    <!-- CSS (orden correcto) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="{% static 'css/login/login.css' %}" rel="stylesheet">
</head>

<body>
    <div class="container-fluid">
        <div class="login-wrapper">
            <div class="login-card">
                <!-- Logo -->
                <div class="logo-section text-center mb-5">
                    <div class="logo-icon mb-4">
                        <i class="fas fa-file-invoice-dollar fs-1 text-white"></i>
                    </div>
                    <h1 class="brand-title mb-2">Control de Gastos</h1>
                    <p class="brand-subtitle">Gestiona tus finanzas con precisión</p>
                </div>

                <!-- Mensajes de Django -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <!-- Formulario -->
                <form id="loginForm" method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    
                    <!-- Usuario -->
                    <div class="mb-4">
                        <label for="username" class="form-label fw-semibold mb-2 d-block">
                            <i class="bi bi-envelope me-2 text-primary"></i>Usuario
                        </label>
                        <input type="text" 
                               class="form-control form-control-lg" 
                               id="username" 
                               name="username"
                               placeholder="usuario" 
                               autocomplete="username" 
                               required>
                    </div>

                    <!-- Contraseña con toggle -->
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold mb-2 d-block">
                            <i class="bi bi-lock me-2 text-primary"></i>Contraseña
                        </label>
                        <div class="input-group">
                            <input type="password" 
                                   class="form-control form-control-lg border-end-0" 
                                   id="password" 
                                   name="password"
                                   placeholder="••••••••" 
                                   autocomplete="current-password" 
                                   required>
                            <span class="input-group-text" id="togglePassword">
                                <i class="bi bi-eye" id="passwordEye"></i>
                            </span>
                        </div>
                    </div>

                    <!-- Botones -->
                    <button type="submit" class="btn btn-login w-100 mb-4">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                    </button>
                    <a href="{% url 'register' %}" class="btn btn-secondary w-100">Registrarse</a>
                </form>

                <!-- Credenciales demo -->
                <div class="credentials text-center mt-4">
                    <small class="text-muted">
                        Demo: <strong>alkewallet@gmail.com</strong> | <strong>alkewallet123</strong>
                    </small>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts (orden correcto: jQuery PRIMERO) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="{% static 'js/utils/utils.js' %}"></script>
    <script src="{% static 'js/login/login.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
